# Publishes fargh.com: on every push to main, build the Astro site, check it, and put dist/ on gh-pages, the branch
# GitHub Pages serves (docs/adr/0002-publishing.md). Pages' own settings are not changed by this file.
name: Publish fargh.com

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/deploy.sh
